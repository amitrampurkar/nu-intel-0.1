<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nu.xyz Competitive Intelligence Hub</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            min-height: 100vh;
        }
        /* Loading indicator */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.5rem;
            color: #4B5563;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">Loading Competitive Intelligence Hub...</div>
    </div>
    
    <script type="text/babel" data-type="module" src="./competitive-intel-hub.jsx"></script>
    
    <script type="text/babel" data-type="module">
        // Wait for component to be loaded
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const { StrictMode } = React;
                const { createRoot } = ReactDOM;
                
                const rootElement = document.getElementById('root');
                const root = createRoot(rootElement);
                
                root.render(
                    React.createElement(StrictMode, null,
                        React.createElement(window.CompetitiveIntelHub)
                    )
                );
            }, 100);
        });
    </script>
</body>
</html>
